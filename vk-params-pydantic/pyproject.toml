[project]
name = "vk-params-pydantic"
version = "0.1.0"
description = "Workbench for VIKTOR parametrization discovery, normalization, and validation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[project.scripts]
vk-params-pydantic = "vk_params_pydantic:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
